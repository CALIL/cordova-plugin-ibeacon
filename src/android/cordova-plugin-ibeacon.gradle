// jcenter は 2021-02 に読み取り専用化、2022 以降は配信も不安定なので使わない。
// cordova-android は templates/project/repositories.gradle で google() と
// mavenCentral() を宣言済みだが、このファイル単体でも解決できるよう明示する。
repositories {
    google()
    mavenCentral()
}

dependencies {
    /*
     **この版を上げ下げするときは、必ず実機でビーコンを検出できることを確かめる。**
     ビルドが通るだけでは分からない。2026-08 の事故では CI が最後までグリーンだった。

     経緯。2026-08-03 に 2.19 から 2.21.1 へ上げたところ、実機がビーコンを
     1本も検出しなくなった。症状は ranging のコールバックが毎秒来るのに結果が
     常に空。UUID を絞らない領域でも空。例外も警告も出ない。権限（付近のデバイス・
     位置情報）は許可済みで、同じ端末・同じビーコンで 2.19 のストア版は動いていた。
     2.21.2 でも直らなかったので 2.19 へ戻して復旧した。

     原因は版そのものではなく、**この LocationManager.java が 2.19 で廃止された
     手動 bind の API を使い続けていたこと**。公式の移行ガイドは
     「Do not mix old binding methods with new autobind methods」と明記している。
     autobind へ移してから 2.21.2 に上げ直した。
     */
    implementation 'org.altbeacon:android-beacon-library:2.21.2'
}

android {
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
}
